<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lernziele Elektroniker</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.1.0/dist/fuse.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;color:#1a1a2e;line-height:1.5}
.container{max-width:1200px;margin:0 auto;padding:20px}
h1{font-size:1.5rem;margin-bottom:4px;color:#16213e}
.subtitle{color:#666;font-size:.9rem;margin-bottom:20px}
.controls{background:#fff;border-radius:10px;padding:16px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:12px}
.search-row{display:flex;gap:10px;align-items:center}
.search-row input{flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:1rem;outline:0;transition:border-color .2s}
.search-row input:focus{border-color:#388e3c}
.search-row .count{white-space:nowrap;font-size:.85rem;color:#888}
.filter-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-group label{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#888}
.filter-group .options{display:flex;flex-wrap:wrap;gap:4px}
.filter-group .options button{padding:4px 10px;font-size:.8rem;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;transition:all .15s;color:#666}
.filter-group .options button:hover{border-color:#388e3c;color:#388e3c}
.filter-group .options button.active{background:#388e3c;color:#fff;border-color:#388e3c}
.clear-btn{padding:4px 10px;font-size:.8rem;border:1px solid #e74c3c;color:#e74c3c;border-radius:6px;background:#fff;cursor:pointer;transition:all .15s}
.clear-btn:hover{background:#e74c3c;color:#fff}
.subject-header{cursor:pointer;padding:12px 16px;background:#fff;border-radius:10px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;align-items:center;gap:10px;transition:background .15s;user-select:none}
.subject-header:hover{background:#f1f8e9}
.subject-header .arrow{font-size:.8rem;color:#999;transition:transform .2s;width:16px}
.subject-header.open .arrow{transform:rotate(90deg)}
.subject-header .code{font-weight:700;color:#388e3c;font-size:.85rem;background:#e8f5e9;padding:2px 8px;border-radius:4px}
.subject-header .name{font-weight:600;color:#16213e}
.subject-content{display:none;padding-left:8px;border-left:3px solid #dcedc8;margin-left:8px;margin-bottom:16px}
.subject-content.open{display:block}
.competence-header{cursor:pointer;padding:10px 14px;background:#fff;border-radius:8px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:10px;transition:background .15s;user-select:none}
.competence-header:hover{background:#f1f8e9}
.competence-header .arrow{font-size:.75rem;color:#bbb;transition:transform .2s;width:14px}
.competence-header.open .arrow{transform:rotate(90deg)}
.competence-header .code{font-weight:600;color:#2e7d32;font-size:.8rem}
.competence-header .name{font-size:.9rem;color:#333}
.competence-content{display:none;padding-left:8px}
.competence-content.open{display:block}
.goal-group{background:#fff;border-radius:6px;margin-bottom:3px;padding:5px 10px;box-shadow:0 1px 2px rgba(0,0,0,.04);border-left:3px solid transparent;display:flex;align-items:center;gap:8px}
.goal-group .goal-code{font-weight:700;color:#16213e;font-size:.8rem;display:flex;align-items:center;gap:5px;white-space:nowrap}
.goal-group .goal-code .code-text{display:inline-block;width:5.5ch}
.goal-group .goal-code .wahl-badge{font-size:.65rem;padding:1px 5px;border-radius:3px;font-weight:600}
.goal-group .goal-code .wahl-badge.optional{background:#fff3e0;color:#e65100}
.goal-group .goal-code .wahl-badge.mandatory{background:#e8f5e9;color:#2e7d32}
.goal-rows{display:flex;flex-wrap:wrap;gap:3px 6px}
.goal-row{display:flex;align-items:center;gap:4px;font-size:.8rem;line-height:1.4}
.goal-row .lernort-badge{flex-shrink:0;font-size:.65rem;padding:1px 5px;border-radius:3px;font-weight:600;min-width:28px;text-align:center}
.lernort-BE{background:#e8f5e9;color:#1b5e20}
.lernort-BFS{background:#f3e5f5;color:#7b1fa2}
.lernort-ük{background:#e0f2f1;color:#00695c}
.goal-row .kriterium{flex:1;color:#444}
.goal-row .niveau-badge{flex-shrink:0;font-size:.65rem;padding:1px 5px;border-radius:3px;font-weight:600;background:#f5f5f5;color:#666}
.no-results{text-align:center;padding:60px 20px;color:#999}
.no-results strong{color:#666}
.highlight{background:#fff176;font-weight:600}
</style>
</head>
<body>
<div class="container">
  <h1>Lernziele Elektroniker EFZ</h1>
  <p class="subtitle" id="subtitle">Laden...</p>

  <div class="controls">
    <div class="search-row">
      <input type="text" id="search" placeholder="Suche nach Code oder Kriterium..." autocomplete="off">
      <span class="count" id="count"></span>
    </div>
    <div class="filter-row" id="filters"></div>
  </div>

  <div id="results"></div>
</div>

<script>
let DATA, fuse, subjects, competences, goals, compBySubject, uniqueNiveaus, uniqueLernorte;
document.getElementById("subtitle").textContent = "Lade Daten...";

(async () => {
  const res = await fetch("data.json");
  DATA = await res.json();

fuse = new Fuse(DATA.goals, {
  keys: [
    { name: 'code', weight: 3 },
    { name: 'kriterium', weight: 1 },
  ],
  threshold: 0.3,
  ignoreLocation: true,
  minMatchCharLength: 3,
});

subjects = DATA.subjects;
competences = DATA.competences;
goals = DATA.goals;

compBySubject = {};
for (const c of competences) {
  const s = c.code[0];
  if (!compBySubject[s]) compBySubject[s] = [];
  compBySubject[s].push(c);
}

uniqueNiveaus = [...new Set(goals.map(g => g.niveau))].sort();
uniqueLernorte = [...new Set(goals.map(g => g.lernort))].sort();

let state = {
  search: '',
  subjects: new Set(),
  competences: new Set(),
  wahlPflicht: new Set(),
  lernorte: new Set(),
  niveaus: new Set(),
};

function checkFilter(set, value) {
  return set.size === 0 || set.has(value);
}

function getCompCode(code) {
  return code.slice(0, code.lastIndexOf('.'));
}

function getFilteredGoals() {
  if (state.search) {
    const words = state.search.trim().split(/\s+/);
    const allResults = [];
    const seen = new Set();
    for (const word of words) {
      if (word.length < 2) continue;
      const result = fuse.search(word);
      for (const r of result) {
        if (!seen.has(r.item)) {
          seen.add(r.item);
          allResults.push(r.item);
        }
      }
    }
    return allResults.filter(g => {
      const s = g.code[0];
      const compCode = getCompCode(g.code);
      return checkFilter(state.subjects, s)
        && checkFilter(state.competences, compCode)
        && checkFilter(state.wahlPflicht, g.wahlPflicht)
        && checkFilter(state.lernorte, g.lernort)
        && checkFilter(state.niveaus, g.niveau);
    });
  }

  return goals.filter(g => {
    const s = g.code[0];
    const compCode = getCompCode(g.code);
    return checkFilter(state.subjects, s)
      && checkFilter(state.competences, compCode)
      && checkFilter(state.wahlPflicht, g.wahlPflicht)
      && checkFilter(state.lernorte, g.lernort)
      && checkFilter(state.niveaus, g.niveau);
  });
}

function render() {
  const filtered = getFilteredGoals();

  document.getElementById('count').textContent = `${filtered.length} von ${goals.length}`;

  const results = document.getElementById('results');
  results.innerHTML = '';

  if (filtered.length === 0) {
    results.innerHTML = '<div class="no-results"><strong>Keine Lernziele gefunden</strong><br>Versuche andere Suchbegriffe oder filtere weniger streng.</div>';
    return;
  }

  for (const subj of subjects) {
    if (!checkFilter(state.subjects, subj.code)) continue;
    const comps = compBySubject[subj.code] || [];
    const hasVisible = comps.some(c => {
      return filtered.some(g => g.code.startsWith(c.code + '.'));
    });
    if (!hasVisible) continue;

    const subjDiv = document.createElement('div');
    const subjHeader = document.createElement('div');
    subjHeader.className = 'subject-header open';
    subjHeader.innerHTML = `<span class="arrow">▶</span><span class="code">${subj.code.toUpperCase()}</span><span class="name">${subj.name}</span>`;
    const subjContent = document.createElement('div');
    subjContent.className = 'subject-content open';

    subjHeader.addEventListener('click', () => {
      subjHeader.classList.toggle('open');
      subjContent.classList.toggle('open');
    });

    for (const comp of comps) {
      if (!checkFilter(state.competences, comp.code)) continue;
      const goalsForComp = filtered.filter(g => g.code.startsWith(comp.code + '.'));
      if (goalsForComp.length === 0) continue;

      const compHeader = document.createElement('div');
      compHeader.className = 'competence-header open';
      compHeader.innerHTML = `<span class="arrow">▶</span><span class="code">${comp.code}</span><span class="name">${comp.name}</span>`;
      const compContent = document.createElement('div');
      compContent.className = 'competence-content open';

      compHeader.addEventListener('click', () => {
        compHeader.classList.toggle('open');
        compContent.classList.toggle('open');
      });

      if (state.search) {
        for (const r of goalsForComp) {
          const div = document.createElement('div');
          div.className = 'goal-group';
          const wahl = r.wahlPflicht;
          const wahlClass = wahl === 'Wahl' ? 'optional' : 'mandatory';
          const lc = r.lernort === 'üK' ? 'ük' : r.lernort;
          div.innerHTML = `<div class="goal-code"><span class="code-text">${highlight(r.code)}</span><span class="wahl-badge ${wahlClass}">${wahl}</span></div><div class="goal-rows"><div class="goal-row"><span class="lernort-badge lernort-${lc}">${r.lernort}</span><span class="kriterium">${highlight(r.kriterium)}</span><span class="niveau-badge">${r.niveau}</span></div></div>`;
          compContent.appendChild(div);
        }
      } else {
        const grouped = {};
        for (const g of goalsForComp) {
          if (!grouped[g.code]) grouped[g.code] = [];
          grouped[g.code].push(g);
        }

        for (const [code, rows] of Object.entries(grouped)) {
          const div = document.createElement('div');
          div.className = 'goal-group';
          const wahl = rows[0].wahlPflicht;
          const wahlClass = wahl === 'Wahl' ? 'optional' : 'mandatory';
          let html = `<div class="goal-code"><span class="code-text">${highlight(code)}</span><span class="wahl-badge ${wahlClass}">${wahl}</span></div><div class="goal-rows">`;
          for (const r of rows) {
            const lc = r.lernort === 'üK' ? 'ük' : r.lernort;
            html += `<div class="goal-row"><span class="lernort-badge lernort-${lc}">${r.lernort}</span><span class="kriterium">${highlight(r.kriterium)}</span><span class="niveau-badge">${r.niveau}</span></div>`;
          }
          html += '</div>';
          div.innerHTML = html;
          compContent.appendChild(div);
        }
      }

      subjContent.appendChild(compHeader);
      subjContent.appendChild(compContent);
    }

    subjDiv.appendChild(subjHeader);
    subjDiv.appendChild(subjContent);
    results.appendChild(subjDiv);
  }
}

function highlight(text) {
  if (!state.search) return escapeHtml(text);
  const words = state.search.trim().split(/\s+/).filter(w => w.length >= 2);
  if (words.length === 0) return escapeHtml(text);
  let result = escapeHtml(text);
  for (const word of words) {
    const q = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    result = result.replace(new RegExp(`(${q})`, 'gi'), '<span class="highlight">$1</span>');
  }
  return result;
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function initFilters() {
  const container = document.getElementById('filters');
  const filters = [
    { id: 'subjects', label: 'Fach', items: subjects.map(s => ({ value: s.code, label: s.code.toUpperCase() })) },
    { id: 'wahlPflicht', label: 'Typ', items: ['Pflicht', 'Wahl'].map(v => ({ value: v, label: v })) },
    { id: 'lernorte', label: 'Lernort', items: uniqueLernorte.map(v => ({ value: v, label: v })) },
    { id: 'niveaus', label: 'Niveau', items: uniqueNiveaus.map(v => ({ value: v, label: v })) },
  ];

  for (const f of filters) {
    const group = document.createElement('div');
    group.className = 'filter-group';
    group.innerHTML = `<label>${f.label}</label><div class="options"></div>`;
    const opts = group.querySelector('.options');

    for (const item of f.items) {
      const btn = document.createElement('button');
      btn.textContent = item.label;
      btn.title = item.label;
      btn.dataset.value = item.value;
      btn.dataset.filterId = f.id;
      btn.addEventListener('click', () => {
        const set = state[f.id];
        if (set.has(item.value)) {
          set.delete(item.value);
        } else {
          set.add(item.value);
        }
        if (f.id === 'subjects') updateCompetenceFilter();
        updateFilterButtons(f.id);
        render();
      });
      opts.appendChild(btn);
    }

    container.appendChild(group);
  }

  const clearBtn = document.createElement('button');
  clearBtn.className = 'clear-btn';
  clearBtn.textContent = 'Filter zurücksetzen';
  clearBtn.addEventListener('click', () => {
    state.search = '';
    document.getElementById('search').value = '';
    state.subjects = new Set();
    state.competences = new Set();
    state.wahlPflicht = new Set();
    state.lernorte = new Set();
    state.niveaus = new Set();
    updateAllFilterButtons();
    render();
  });
  const clearGroup = document.createElement('div');
  clearGroup.className = 'filter-group';
  clearGroup.innerHTML = '<label>Reset</label><div class="options"></div>';
  clearGroup.querySelector('.options').appendChild(clearBtn);
  container.appendChild(clearGroup);
}

function updateFilterButtons(id) {
  const btns = document.querySelectorAll(`[data-filter-id="${id}"]`);
  const set = state[id];
  btns.forEach(b => {
    b.classList.toggle('active', set.has(b.dataset.value));
  });
}

function updateAllFilterButtons() {
  for (const id of ['subjects', 'wahlPflicht', 'lernorte', 'niveaus']) {
    updateFilterButtons(id);
  }
}

function updateCompetenceFilter() {
  if (state.subjects.size === 0) {
    state.competences = new Set();
    return;
  }
  const visible = [];
  for (const s of state.subjects) {
    for (const c of compBySubject[s] || []) {
      visible.push(c.code);
    }
  }
  state.competences = new Set(visible);
}

document.getElementById('search').addEventListener('input', e => {
  state.search = e.target.value.trim();
  render();
});

  document.getElementById("subtitle").textContent = goals.length + " Lernziele in " + subjects.length + " Fächern und " + competences.length + " Handlungskompetenzen";
  initFilters();
  updateCompetenceFilter();
  render();
})();
</script>
</body>
</html>
